name: Suggest an improvement
description: Help make the kit clearer or safer.
body:
  - type: textarea
    id: need
    attributes:
      label: What was confusing or missing?
      description: Describe the task without personal information or real migration records.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would help?
      description: Wording suggestions and small examples are welcome.
